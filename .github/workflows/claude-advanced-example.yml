name: Claude Advanced Review (Example)

# This is an advanced example showing all available options
# Customize this template for your specific needs

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'content/**'
      - 'extensions/**'
  workflow_dispatch:
    inputs:
      custom_prompt:
        description: 'Custom review prompt'
        required: false
        default: '/review'

jobs:
  advanced-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Fetch full history for better context

      - name: Setup Python (if needed for MCP servers)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Advanced Review with Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Use workflow input or default prompt
          prompt: ${{ github.event.inputs.custom_prompt || '/review' }}

          # Advanced CLI arguments
          claude_args: |
            --max-turns 10
            --model claude-sonnet-4-5-20250929
            --system-prompt "You are reviewing Odoo documentation. Follow RST formatting standards and ensure code examples are accurate for Odoo framework."

          # Optional: Additional environment variables
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment PR with custom message
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Claude Code review completed! Check the workflow logs for detailed feedback.'
            })
